services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orcamento3d
      POSTGRES_USER: ${DB_USER:-orcamento3d}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orcamento3d
      DB_USER: ${DB_USER:-orcamento3d}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SUPPORT_ADMIN_EMAILS: ${SUPPORT_ADMIN_EMAILS:-jonathangtec@gmail.com}
      # O ambiente local continua em desenvolvimento. A hospedagem deverá definir "prod"
      # e será recusada automaticamente se JWT_SECRET ainda for uma chave de exemplo.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
