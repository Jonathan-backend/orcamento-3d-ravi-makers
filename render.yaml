services:
  - type: web
    name: orcamento-3d
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/public/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: DB_URL
        fromDatabase:
          name: orcamento-3d-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: orcamento-3d-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: orcamento-3d-db
          property: password
      - key: ADMIN_INITIAL_PASSWORD
        sync: false

databases:
  - name: orcamento-3d-db
    plan: free
    region: virginia
    postgresMajorVersion: "18"
    databaseName: orcamento3d
    user: orcamento3d
    ipAllowList: []
