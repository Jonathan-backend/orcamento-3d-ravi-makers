spring:
  jpa:
    hibernate:
      # Ambiente de testes público: cria/atualiza o esquema no primeiro deploy.
      # Antes de uso comercial, substituir por migrações Flyway versionadas.
      ddl-auto: update
server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
app:
  encryption:
    secret: ${DATA_ENCRYPTION_KEY}
  auth:
    secure-cookie: true
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 7200
