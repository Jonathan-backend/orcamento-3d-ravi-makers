spring:
  main:
    lazy-initialization: true
  jpa:
    hibernate:
      # O esquema inicial já foi criado no Neon. Evita consultar todo o catálogo
      # a cada cold start e mantém a inicialização dentro do limite da Vercel.
      ddl-auto: none
  data:
    jpa:
      repositories:
        bootstrap-mode: lazy
server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
app:
  encryption:
    secret: ${DATA_ENCRYPTION_KEY}
  auth:
    secure-cookie: true
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 7200
