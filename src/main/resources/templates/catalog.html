<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo 3D</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/brand.css"></head>
<body class="catalog-public"><header class="catalog-public-header"><div id="publicBrand" class="catalog-brand"><span class="ravi-brand-logo catalog-ravi-logo"></span></div><div class="catalog-header-actions"><button id="cartButton" type="button">🛒 Carrinho <span id="cartCount">0</span></button></div></header>
<main class="catalog-public-main"><section class="catalog-hero"><p class="eyebrow">IMPRESSÃO 3D SOB ENCOMENDA</p><h1 id="publicTitle">Catálogo</h1><p>Escolha cores, tamanhos e produtos; finalize o pedido diretamente pelo WhatsApp.</p></section>
<nav id="categoryNav" class="catalog-categories"></nav><div id="publicProducts" class="public-product-grid"></div><p id="publicEmpty" class="empty">Nenhum produto publicado neste catálogo.</p></main>
<aside id="cartDrawer" class="cart-drawer hidden"><div class="cart-head"><h2>Seu carrinho</h2><button id="closeCart" type="button">×</button></div><div id="cartItems" class="cart-items"></div><div class="coupon-box"><input id="cartCoupon" placeholder="Cupom de desconto"><button id="applyCoupon" type="button">Aplicar</button><small id="couponFeedback"></small></div><div class="cart-summary"><div><span>Subtotal</span><strong id="cartSubtotal">R$ 0,00</strong></div><div><span>Desconto</span><strong id="cartDiscount">R$ 0,00</strong></div><div class="cart-total"><span>Total</span><strong id="cartTotal">R$ 0,00</strong></div></div><button id="checkoutWhatsapp" type="button">Finalizar pelo WhatsApp</button></aside>
<script>
const ownerId=location.pathname.split('/').filter(Boolean).pop(),cartKey=`catalog-cart-${ownerId}`,money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),escapeHtml=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML};let catalog=null,cart=JSON.parse(localStorage.getItem(cartKey)||'[]'),discount=0,category='Todos';
const variants=value=>String(value||'').split(',').map(x=>x.trim()).filter(Boolean),images=p=>Array.isArray(p.images)&&p.images.length?p.images:[p.imageDataUrl,p.image2DataUrl,p.image3DataUrl].filter(Boolean);
function renderCategories(){const categories=['Todos',...new Set(catalog.products.map(p=>p.category))];categoryNav.innerHTML=categories.map(c=>`<button class="${c===category?'active':''}" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}
function renderProducts(){const rows=catalog.products.filter(p=>category==='Todos'||p.category===category);publicEmpty.hidden=rows.length>0;publicProducts.innerHTML=rows.map(p=>{const pics=images(p),colors=variants(p.colors),sizes=variants(p.sizes);return `<article class="public-product-card ${p.featured?'featured':''}">${pics.length?`<div class="public-gallery"><img src="${escapeHtml(pics[0])}" alt="${escapeHtml(p.name)}">${pics.length>1?`<div>${pics.map((x,i)=>`<button data-gallery-product="${p.id}" data-gallery-image="${i}"><img src="${escapeHtml(x)}" alt=""></button>`).join('')}</div>`:''}</div>`:'<div class="product-placeholder">3D</div>'}<div><span>${escapeHtml(p.category)}${p.featured?' · DESTAQUE':''}</span><h2>${escapeHtml(p.name)}</h2><p>${escapeHtml(p.description||'Produto impresso em 3D sob encomenda.')}</p><strong>${money(p.price)}</strong>${colors.length?`<label>Cor<select data-option-color="${p.id}">${colors.map(x=>`<option>${escapeHtml(x)}</option>`).join('')}</select></label>`:''}${sizes.length?`<label>Tamanho<select data-option-size="${p.id}">${sizes.map(x=>`<option>${escapeHtml(x)}</option>`).join('')}</select></label>`:''}<button data-add-cart="${p.id}">Adicionar ao carrinho</button></div></article>`}).join('')}
function addQuestionButtons(){document.querySelectorAll('[data-add-cart]').forEach(add=>{if(add.previousElementSibling?.matches('[data-product-question]'))return;const button=document.createElement('button');button.className='product-question';button.dataset.productQuestion=add.dataset.addCart;button.textContent='Dúvidas pelo WhatsApp';add.before(button)})}
function renderCart(){localStorage.setItem(cartKey,JSON.stringify(cart));cartCount.textContent=cart.reduce((s,x)=>s+x.quantity,0);cartItems.innerHTML=cart.length?cart.map((x,i)=>`<div class="cart-item"><div><strong>${escapeHtml(x.name)}</strong><small>${[x.color,x.size].filter(Boolean).map(escapeHtml).join(' · ')}</small><span>${money(x.price)}</span></div><div><button data-cart-minus="${i}">−</button><b>${x.quantity}</b><button data-cart-plus="${i}">＋</button><button data-cart-remove="${i}">×</button></div></div>`).join(''):'<p class="empty">Seu carrinho está vazio.</p>';const subtotal=cart.reduce((s,x)=>s+x.price*x.quantity,0),off=subtotal*discount/100;cartSubtotal.textContent=money(subtotal);cartDiscount.textContent=`− ${money(off)}`;cartTotal.textContent=money(subtotal-off)}
categoryNav.onclick=e=>{const b=e.target.closest('[data-category]');if(!b)return;category=b.dataset.category;renderCategories();renderProducts();addQuestionButtons()};
publicProducts.onclick=e=>{const thumb=e.target.closest('[data-gallery-image]');if(thumb){const p=catalog.products.find(x=>x.id===Number(thumb.dataset.galleryProduct));thumb.closest('.public-gallery').querySelector(':scope>img').src=images(p)[Number(thumb.dataset.galleryImage)];return}const question=e.target.closest('[data-product-question]');if(question){const p=catalog.products.find(x=>x.id===Number(question.dataset.productQuestion)),phone=String(catalog.phone||'').replace(/\D/g,'');if(!phone){alert('O WhatsApp da empresa ainda não foi configurado.');return}window.open(`https://wa.me/55${phone}?text=${encodeURIComponent(`Olá! Tenho uma dúvida sobre o produto: ${p.name}`)}`,'_blank','noopener');return}const b=e.target.closest('[data-add-cart]');if(!b)return;const p=catalog.products.find(x=>x.id===Number(b.dataset.addCart)),color=document.querySelector(`[data-option-color="${p.id}"]`)?.value||'',size=document.querySelector(`[data-option-size="${p.id}"]`)?.value||'',same=cart.find(x=>x.id===p.id&&x.color===color&&x.size===size);if(same)same.quantity++;else cart.push({id:p.id,name:p.name,price:Number(p.price),color,size,quantity:1});renderCart();cartDrawer.classList.remove('hidden')};
cartItems.onclick=e=>{for(const action of ['minus','plus','remove']){const b=e.target.closest(`[data-cart-${action}]`);if(!b)continue;const i=Number(b.dataset[`cart${action[0].toUpperCase()+action.slice(1)}`]);if(action==='plus')cart[i].quantity++;else if(action==='minus'&&--cart[i].quantity<=0)cart.splice(i,1);else if(action==='remove')cart.splice(i,1);renderCart();break}};
cartButton.onclick=()=>cartDrawer.classList.remove('hidden');closeCart.onclick=()=>cartDrawer.classList.add('hidden');
applyCoupon.onclick=async()=>{couponFeedback.textContent='Validando...';const r=await fetch(`/api/public/catalog/${ownerId}/coupon/${encodeURIComponent(cartCoupon.value.trim())}`),c=await r.json();if(!r.ok){discount=0;couponFeedback.textContent=c.message||'Cupom inválido'}else{discount=Number(c.discountPercent);couponFeedback.textContent=`Cupom ${c.code}: ${discount}% de desconto`}renderCart()};
checkoutWhatsapp.onclick=()=>{if(!cart.length){couponFeedback.textContent='Adicione produtos ao carrinho.';return}const profile=JSON.parse(localStorage.getItem('profile')||'{}'),phone=String(catalog.phone||'').replace(/\D/g,'');if(!phone){couponFeedback.textContent='WhatsApp não configurado pelo vendedor.';return}const subtotal=cart.reduce((s,x)=>s+x.price*x.quantity,0),total=subtotal*(1-discount/100),lines=cart.map(x=>`• ${x.quantity}x ${x.name}${x.color?` | Cor: ${x.color}`:''}${x.size?` | Tamanho: ${x.size}`:''} — ${money(x.price*x.quantity)}`);const text=`Olá! Sou ${profile.name||'cliente'} e gostaria de fazer este pedido:\\n\\n${lines.join('\\n')}\\n\\n${discount?`Desconto: ${discount}%\\n`:''}Total: ${money(total)}`;window.open(`https://wa.me/55${phone}?text=${encodeURIComponent(text)}`,'_blank','noopener')};
fetch(`/api/public/catalog/${ownerId}`).then(r=>r.json()).then(c=>{catalog=c;publicTitle.textContent=c.companyName;document.title=`${c.companyName} · Catálogo`;publicBrand.innerHTML=c.logoDataUrl?`<img src="${escapeHtml(c.logoDataUrl)}" alt=""><strong>${escapeHtml(c.companyName)}</strong>`:`<span class="ravi-brand-logo catalog-ravi-logo"></span>`;renderCategories();renderProducts();addQuestionButtons();renderCart()}).catch(()=>{publicEmpty.textContent='Catálogo indisponível.'});
</script></body></html>
